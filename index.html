
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sraz UPCE TŘD – 20 let</title>
<style>
body{
font-family: Arial, sans-serif;
margin:0;
background:#f5f5f5;
}
header{
background:#2c3e50;
color:white;
padding:20px;
text-align:center;
}
nav{
display:flex;
justify-content:center;
background:#34495e;
}
nav button{
background:none;
border:none;
color:white;
padding:15px 20px;
cursor:pointer;
font-size:16px;
}
nav button:hover{
background:#2c3e50;
}
section{
display:none;
padding:20px;
max-width:800px;
margin:auto;
background:white;
margin-top:20px;
border-radius:8px;
}
section.active{
display:block;
}
button.answer{
margin:5px;
padding:12px 20px;
font-size:16px;
cursor:pointer;
}
input, textarea{
width:100%;
padding:10px;
margin:5px 0 10px 0;
}
.chat-box{
border:1px solid #ccc;
height:250px;
overflow-y:auto;
padding:10px;
margin-bottom:10px;
background:#fafafa;
}
.response{
padding:5px 0;
border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<header>
<h1>Sraz UPCE TŘD – 20 let</h1>
<p>Sobota 13. 6. 2026</p>
</header>

<nav>
<button onclick="showTab('ucast')">Účast</button>
<button onclick="showTab('chat')">Chat</button>
<button onclick="showTab('program')">Program</button>
</nav>

<section id="ucast" class="active">
<h2>Potvrzení účasti</h2>

<label>Jméno:</label>
<input id="nameInput">

<div>
<button class="answer" onclick="vote('Ano')">Ano</button>
<button class="answer" onclick="vote('Ne')">Ne</button>
<button class="answer" onclick="vote('Ještě nevím')">Ještě nevím</button>
</div>

<h3>Odpovědi:</h3>
<div id="responses"></div>
</section>


<section id="chat">
<h2>Chat</h2>

<label>Jméno:</label>
<input id="chatName">

<div class="chat-box" id="chatBox"></div>

<textarea id="chatMessage" placeholder="Napiš zprávu..."></textarea>
<button onclick="sendMessage()">Odeslat</button>

</section>


<section id="program">
<h2>Program</h2>
<p>... bude upřesněno ..</p>
</section>

<script>

function showTab(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function vote(answer){

let name=document.getElementById("nameInput").value.trim();
if(!name){
alert("Vyplň jméno.");
return;
}

let responses=JSON.parse(localStorage.getItem("responses")||"[]");

responses.push({
name:name,
answer:answer,
time:new Date().toLocaleString()
});

localStorage.setItem("responses",JSON.stringify(responses));

renderResponses();
}

function renderResponses(){

let responses=JSON.parse(localStorage.getItem("responses")||"[]");

let container=document.getElementById("responses");
container.innerHTML="";

responses.forEach(r=>{
let div=document.createElement("div");
div.className="response";
div.textContent=r.name+" – "+r.answer;
container.appendChild(div);
});
}

function sendMessage(){

let name=document.getElementById("chatName").value.trim();
let message=document.getElementById("chatMessage").value.trim();

if(!name || !message){
alert("Vyplň jméno i zprávu.");
return;
}

let chat=JSON.parse(localStorage.getItem("chat")||"[]");

chat.push({
name:name,
message:message,
time:new Date().toLocaleTimeString()
});

localStorage.setItem("chat",JSON.stringify(chat));

document.getElementById("chatMessage").value="";

renderChat();
}

function renderChat(){

let chat=JSON.parse(localStorage.getItem("chat")||"[]");

let box=document.getElementById("chatBox");
box.innerHTML="";

chat.forEach(m=>{

let div=document.createElement("div");
div.textContent="["+m.time+"] "+m.name+": "+m.message;
box.appendChild(div);

});

box.scrollTop=box.scrollHeight;
}

renderResponses();
renderChat();

</script>

</body>
</html>
