
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sraz UPCE TŘD – 20 let</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f2f2f2}
header{background:#2c3e50;color:white;text-align:center;padding:20px}
nav{display:flex;justify-content:center;background:#34495e}
nav button{background:none;border:none;color:white;padding:14px 20px;font-size:16px;cursor:pointer}
nav button:hover{background:#2c3e50}
section{display:none;max-width:900px;margin:20px auto;background:white;padding:20px;border-radius:8px}
section.active{display:block}
input,textarea{width:100%;padding:10px;margin:6px 0}
button.vote{padding:12px 18px;margin:5px;font-size:16px;cursor:pointer}
#responses div{padding:6px;border-bottom:1px solid #eee}
.chatbox{border:1px solid #ddd;height:250px;overflow-y:auto;padding:10px;background:#fafafa;margin-bottom:10px}
</style>
</head>

<body>

<header>
<h1>Sraz UPCE TŘD – 20 let</h1>
<p>Sobota 13. 6. 2026</p>
</header>

<nav>
<button onclick="tab('ucast')">Účast</button>
<button onclick="tab('chat')">Chat</button>
<button onclick="tab('program')">Program</button>
</nav>

<section id="ucast" class="active">
<h2>Potvrzení účasti</h2>

<label>Jméno</label>
<input id="name">

<div>
<button class="vote" onclick="vote('Ano')">Ano</button>
<button class="vote" onclick="vote('Ne')">Ne</button>
<button class="vote" onclick="vote('Ještě nevím')">Ještě nevím</button>
</div>

<h3>Statistika</h3>
<canvas id="chart"></canvas>

<h3>Seznam odpovědí</h3>
<div id="responses"></div>
</section>

<section id="chat">
<h2>Chat</h2>

<label>Jméno</label>
<input id="chatName">

<div class="chatbox" id="chatbox"></div>

<textarea id="msg" placeholder="Napiš zprávu"></textarea>
<button onclick="send()">Odeslat</button>
</section>

<section id="program">
<h2>Program</h2>
<p>... bude upřesněno ..</p>
</section>

<script>

function tab(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")
}

function getData(){
return JSON.parse(localStorage.getItem("responses")||"[]")
}

function saveData(d){
localStorage.setItem("responses",JSON.stringify(d))
}

function vote(ans){

let name=document.getElementById("name").value.trim()
if(!name){alert("Vyplň jméno");return}

let data=getData()
data.push({name:name,answer:ans})
saveData(data)
render()
}

function render(){

let data=getData()
let r=document.getElementById("responses")
r.innerHTML=""

let a=0,n=0,j=0

data.forEach(x=>{

if(x.answer=="Ano")a++
if(x.answer=="Ne")n++
if(x.answer=="Ještě nevím")j++

let d=document.createElement("div")
d.textContent=x.name+" – "+x.answer
r.appendChild(d)

})

draw(a,n,j)
}

let chart

function draw(a,n,j){

let ctx=document.getElementById("chart")

if(chart)chart.destroy()

chart=new Chart(ctx,{
type:"bar",
data:{
labels:["Ano","Ne","Ještě nevím"],
datasets:[{data:[a,n,j]}]
},
options:{plugins:{legend:{display:false}}}
})
}

function chatData(){
return JSON.parse(localStorage.getItem("chat")||"[]")
}

function saveChat(d){
localStorage.setItem("chat",JSON.stringify(d))
}

function send(){

let name=document.getElementById("chatName").value.trim()
let msg=document.getElementById("msg").value.trim()

if(!name||!msg){alert("Vyplň jméno i zprávu");return}

let c=chatData()
c.push({name:name,msg:msg,time:new Date().toLocaleTimeString()})
saveChat(c)

document.getElementById("msg").value=""
renderChat()
}

function renderChat(){

let c=chatData()
let box=document.getElementById("chatbox")
box.innerHTML=""

c.forEach(m=>{

let d=document.createElement("div")
d.textContent="["+m.time+"] "+m.name+": "+m.msg
box.appendChild(d)

})

box.scrollTop=box.scrollHeight
}

render()
renderChat()

</script>

</body>
</html>
